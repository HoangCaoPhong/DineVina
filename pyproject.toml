[project]
name = "dinevina"
version = "0.2.0"
description = "Smart restaurant reservation and event booking system"
requires-python = ">=3.12"
dependencies = [
	"fastapi==0.143.0",
	"uvicorn[standard]==0.54.0",
	"sqlalchemy==2.0.44",
	"psycopg2-binary==2.9.11",
]

[project.optional-dependencies]
dev = [
	"httpx==0.28.1",
	"pytest==9.1.1",
	"ruff==0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
filterwarnings = [
    "ignore:Using .httpx. with .starlette.testclient. is deprecated:UserWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 88
lint.ignore = ["EXE002"] # The shared NTFS workspace reports all files as executable.

[tool.pyrefly]
search-path = ["backend"]

[tool.pyright]
extraPaths = ["backend"]
