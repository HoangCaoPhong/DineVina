[project]
name = "dinevina"
version = "0.1.0"
description = "Smart restaurant reservation and event booking system"
requires-python = ">=3.12"
dependencies = [
	"fastapi==0.143.0",
	"uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
	"httpx==0.28.1",
	"pytest==9.1.1",
	"ruff==0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
lint.ignore = ["EXE002"] # The shared NTFS workspace reports all files as executable.
